plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id("com.chaquo.python")
}

android {
    namespace 'com.example.videodownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.videodownloader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // On Apple silicon, you can omit x86_64.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        python{
            version "3.8"
        }
        python{
            buildPython "/usr/bin/python3"
        }
        python{
            pip {
                // A requirement specifier, with or without a version number:

                install("yt-dlp")
                install("imageio[ffmpeg]")

            }
        }


    }
    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    sourceSets {
        getByName("main") {
            python.srcDir("src/main/python")
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
//    implementation 'io.github.junkfood02.youtubedl-android:library:0.16.0'
//    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.16.0'
//    // Optional: for additional features
//    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.16.0'
    implementation 'com.arthenica:mobile-ffmpeg-full:4.4.LTS'



}